<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diken — TikTok bağlantısı</title>
<style>
  body{max-width:34rem;margin:0 auto;padding:4rem 1.25rem;
       font:16px/1.7 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
       color:#1c1c1e;background:#fff}
  h1{font-size:1.4rem;margin:0 0 .5rem}
  .kutu{margin:1.6rem 0;padding:1rem 1.1rem;background:#f5f5f7;
        border:1px solid #e0e0e4;border-radius:10px;
        font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
        font-size:.92rem;word-break:break-all;user-select:all}
  button{padding:.6rem 1.1rem;font-size:.95rem;border:0;border-radius:8px;
         background:#1c1c1e;color:#fff;cursor:pointer}
  button:active{opacity:.75}
  .not{color:#6b6b70;font-size:.9rem;margin-top:2rem}
  .hata{color:#c02626}
  code{background:#f3f3f5;padding:.1rem .35rem;border-radius:3px}
</style>
</head>
<body>

<h1>TikTok bağlantısı</h1>
<div id="govde">okunuyor…</div>

<p class="not">Bu sayfa hiçbir veri saklamaz ve hiçbir yere göndermez.
Kod yalnızca tarayıcınızın adres çubuğundan okunup ekranda gösterilir.</p>

<script>
  const s = new URLSearchParams(location.search);
  const kod = s.get("code");
  const hata = s.get("error");
  const g = document.getElementById("govde");

  if (hata) {
    g.innerHTML = '<p class="hata">Yetki verilmedi: ' +
      (s.get("error_description") || hata) + '</p>';
  } else if (!kod) {
    g.innerHTML = '<p class="hata">Adreste kod yok. Yetki akışını baştan başlatın.</p>';
  } else {
    g.innerHTML =
      '<p>Aşağıdaki kodu kopyalayıp uygulamaya yapıştırın:</p>' +
      '<div class="kutu" id="kod">' + kod + '</div>' +
      '<button id="kopyala">Kopyala</button>' +
      '<p class="not">Sonra çalıştırın:<br>' +
      '<code>python tiktok_api.py kod &lt;KOD&gt;</code></p>';
    document.getElementById("kopyala").onclick = () => {
      navigator.clipboard.writeText(kod).then(() => {
        document.getElementById("kopyala").textContent = "Kopyalandı ✓";
      });
    };
  }
</script>

</body>
</html>
